site:
  name: CONC Thammasat
  site: 'https://conc.tbs.tu.ac.th'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: CONC Thammasat
    template: '%s | CONC Thammasat'
  description: 'หลักสูตรฝึกอบรม สัมมนา บริการให้คำปรึกษา และองค์ความรู้สำหรับผู้บริหาร องค์กร และผู้เรียนรู้ตลอดชีวิต'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: CONC Thammasat
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@conc_thammasat'
    site: '@conc_thammasat'
    cardType: summary_large_image

i18n:
  language: th
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-14KXWFKJXE'

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"


